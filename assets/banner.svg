<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)"/>
    </pattern>

    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(8deg); }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes flowDot {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite alternate; }
    .orb-purple { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; }
    .floating { animation: floatParticle 6s ease-in-out infinite; }
    .circuit-line { stroke-dasharray: 8 12; animation: flowDot 20s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-cyan" cx="150" cy="100" r="180" fill="url(#glow-cyan)" filter="url(#blur-bg)"/>
  <circle class="orb-purple" cx="1050" cy="300" r="220" fill="url(#glow-purple)" filter="url(#blur-bg)"/>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Circuit / API Request Lines in Background (Non-intrusive) -->
  <g opacity="0.35">
    <path class="circuit-line" d="M 0 80 Q 300 140 600 70 T 1200 110" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path class="circuit-line" d="M 0 340 Q 400 270 800 350 T 1200 300" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Decorative Outer Stroke -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- MAIN FOREGROUND CONTENT (Always readable and in front) -->

  <!-- Pill Badge: Category -->
  <g class="floating" transform="translate(435, 45)">
    <rect width="330" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="url(#pill-border)" stroke-width="1.5" filter="url(#badge-glow)"/>
    <circle cx="20" cy="18" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      DEVELOPER EXPERIENCE &amp; DOCS
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
    Interactive API Documentation
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="-0.3">
    Platform Ecosystem
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    Curated SaaS Developer Hubs, OpenAPI/AsyncAPI Renderers, Interactive Consoles &amp; SDK Generators
  </text>

  <!-- Interactive Spec Feature Pills (Bottom Row) -->
  <g transform="translate(140, 280)">
    <!-- Pill 1: OpenAPI 3.1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">⚡ OpenAPI 3.1</text>
    </g>

    <!-- Pill 2: AsyncAPI -->
    <g transform="translate(185, 0)">
      <rect width="160" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🔄 AsyncAPI</text>
    </g>

    <!-- Pill 3: GraphQL & gRPC -->
    <g transform="translate(370, 0)">
      <rect width="180" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🔮 GraphQL &amp; gRPC</text>
    </g>

    <!-- Pill 4: Live "Try It Out" -->
    <g transform="translate(575, 0)">
      <rect width="165" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
      <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🎯 "Try It" Sandbox</text>
    </g>

    <!-- Pill 5: SDK Automation -->
    <g transform="translate(765, 0)">
      <rect width="155" height="42" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
      <text x="77" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">📦 Client SDKs</text>
    </g>
  </g>

  <!-- Bottom Terminal / Spec Status Bar -->
  <g transform="translate(350, 355)">
    <rect width="500" height="30" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#ef4444"/>
    <circle cx="30" cy="15" r="4" fill="#eab308"/>
    <circle cx="44" cy="15" r="4" fill="#22c55e"/>
    <text x="60" y="19" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#94a3b8">GET /v1/specs/openapi.json — 200 OK (Interactive Console Ready)</text>
  </g>
</svg>